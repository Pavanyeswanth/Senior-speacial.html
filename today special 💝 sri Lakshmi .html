<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 💖</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family:'Segoe UI',sans-serif;
  overflow:hidden;
}

.container{
  text-align:center;
}

.love-grid{
  font-size:24px;
  color:#ff2f92;
  line-height:28px;
  animation:float 2s infinite alternate;
}

@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(-10px);}
}

.name{
  font-size:48px;
  color:#e60073;
  font-weight:900;
  margin:20px 0;
  text-shadow: 2px 2px 5px #ff99cc;
}

.quote{
  margin-top:15px;
  font-size:20px;
  color:#b1005a;
  font-weight:600;
  animation:fade 6s infinite;
}

@keyframes fade{
  0%{opacity:0;}
  20%{opacity:1;}
  80%{opacity:1;}
  100%{opacity:0;}
}
</style>
</head>

<body>
<div class="container">

  <!-- ❤️ Love symbols everywhere -->
  <div class="love-grid">
    💖💘💗💖💘💗💖💘💗💖💘💗💖<br>
    💘💗💖💘💗💖💘💗💖💘💗💖💘<br>
    💗💖💘💗💖💘💗💖💘💗💖💘💗<br>
    💖💘💗💖💘💗💖💘💗💖💘💗💖
  </div>

  <!-- Name in big letters -->
  <div class="name">SRI LAKSHMI</div>

  <!-- Quotes / Respectful love messages -->
  <div class="quote" id="quote"></div>

</div>

<script>
const quotes = [
  "Some people are like home… you feel calm 💕",
  "You are a special soul I deeply respect 🌸",
  "Just seeing you makes my heart smile 💖",
  "I feel lucky to know someone as amazing as you 💗",
  "I wanted to share my heart respectfully… 💘"
];

let i = 0;
const quoteBox = document.getElementById("quote");

setInterval(()=>{
  quoteBox.innerText = quotes[i];
  i = (i + 1) % quotes.length;
},5000);
</script>
</body>
</html>
